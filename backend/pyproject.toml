[project]
name = "silicon-valley-trail-backend"
version = "0.1.0"
description = "Backend API and Game Engine for Silicon Valley Trail"
requires-python = ">=3.14"
dependencies = [
    "django",
    "django-prometheus",
    "django-redis",
]

[dependency-groups]
prod = [
    "gunicorn",
    "psycopg",
]
dev = [
    "django-cors-headers",
    "django-stubs[compatible-mypy]",
    "mypy",
    "psycopg[binary]",
]
